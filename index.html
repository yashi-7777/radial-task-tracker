<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#DD2A7B" />
<title>Radial Action Plan</title>
<link rel="stylesheet" href="styles.css?v=7" />
<link rel="stylesheet" href="study.css?v=7" />
</head>
<body>
  <div class="app no-anim" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-head">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/><path d="M12 8a4 4 0 1 1-4 4"/></svg>
        </div>
        <span class="brand-name">Action Plan</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
        <div class="topbar-title">
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-date" id="topDate"></div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="syllabus-parse.js?v=7"></script>
  <script src="planner.js?v=7"></script>
  <script src="pages.js?v=7"></script>
  <script src="study.js?v=7"></script>
  <script src="study-setup.js?v=7"></script>
  <script src="study-plan.js?v=7"></script>
  <script src="study-chat.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
